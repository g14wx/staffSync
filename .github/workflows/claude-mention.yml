name: Claude Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude on demand
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-opus-4-7"
          trigger_phrase: "@claude"
          allowed_tools: "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(cat:*),Bash(rg:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format --verify-no-changes:*)"
          direct_prompt: |
            You were mentioned with `@claude` on a PR or issue in the `staffsync` backend repository.

            Before acting:

            1. Read `.specify/memory/constitution.md`, `REVIEW.md`, `task.md`, and any relevant file under `.qodo/rules/`.
            2. Read `CLAUDE.md` for project memory.

            Respond to the request that triggered this mention. If the request is a review, apply the same rules as `.github/workflows/claude-pr-review.yml`. If it is a question, answer it grounded in the constitution and the code. If it is a task, propose a plan first and wait for confirmation before making destructive changes.

            Commits and branches follow `task.md` naming: `<version>/<type>/<PROJECTCODE>-<task-number>-<kebab>` and `<type>(<PROJECTCODE>-<task-number>): <desc>`. Never create a commit without explicit user approval in the triggering comment.
